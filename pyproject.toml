[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game_engine"
version = "0.1.0"
description = "A pure Python 3D game engine for learning graphics fundamentals"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Liam Burton", email = "liamburton@msn.com"}
]

# Core dependencies (currently none for pure Python)
dependencies = []

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

# Documentation dependencies
#docs = [
#    "sphinx>=7.0",
#    "sphinx-rtd-theme>=1.3",
#]

# Future rendering dependencies (commented out for now)
# rendering = [
#     "PyOpenGL>=3.1",
#     "pygame>=2.5",
# ]

# Performance optimization dependencies (for Phase 10)
# performance = [
#     "numpy>=1.24",
#     "numba>=0.57",
# ]

#[project.urls]
#Homepage = "https://github.com/yourusername/game-engine"
#Documentation = "https://game-engine.readthedocs.io"
#Repository = "https://github.com/yourusername/game-engine"
#Issues = "https://github.com/yourusername/game-engine/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose --cov=src/engine --cov-report=html --cov-report=term"
env = [
    "NUMBA_DISABLE_JIT=1"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313", "py314"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
